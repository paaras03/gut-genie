openapi: 3.1.0
info:
  title: Gut Genie API
  version: 0.1.2
  description: Private API for logging digestive events and reading Gut Genie records.
servers:
  - url: https://script.google.com/macros/s/AKfycbxBsK1rLBU1RHuUF4IlVxw8gButphw6zTmwKdeckC_E4gGSx9cbGsOsZXW3D-znOlW--Q
paths:
  /exec:
    post:
      operationId: gutGenieRequest
      summary: Log or retrieve Gut Genie data
      description: Send one supported API action in a JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, integrationToken]
              properties:
                action:
                  type: string
                  enum: [health, dashboard, events, log-event, update-event, save-report, reports, report, hypotheses, log-analysis, run-status, version]
                integrationToken:
                  type: string
                  description: Private dedicated Gut Genie integration credential.
                date:
                  type: string
                  description: Date in YYYY-MM-DD format.
                event_type:
                  type: string
                  enum: [food, symptom, sleep, exercise, bowel]
                occurred_at:
                  type: string
                  description: ISO 8601 timestamp when known.
                from_date:
                  type: string
                to_date:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                idempotency_key:
                  type: string
                source_message_id:
                  type: string
                record_id:
                  type: string
                report_id:
                  type: string
                status:
                  type: string
                data:
                  type: object
                  description: Event fields matching the selected event sheet columns. Supply these as explicit properties inside data, not as top-level request fields.
                  properties:
                    meal_type:
                      type: string
                    description:
                      type: string
                    items_json:
                      type: string
                      description: JSON-encoded array of food items, including quantities and units.
                    fodmap_groups:
                      type: array
                      items:
                        type: string
                    estimated_load:
                      type: string
                    symptoms:
                      type: string
                    fullness_score:
                      type: number
                    gas_level:
                      type: string
                    gas_smell:
                      type: string
                    acidity_score:
                      type: number
                    pain_score:
                      type: number
                    bowel_urgency:
                      type: string
                    onset_type:
                      type: string
                    stool_form:
                      type: string
                    urgency:
                      type: string
                    straining:
                      type: boolean
                    incomplete_emptying:
                      type: boolean
                    sleep_start:
                      type: string
                    wake_at:
                      type: string
                    duration_minutes:
                      type: integer
                    quality_score:
                      type: number
                    started_at:
                      type: string
                    ended_at:
                      type: string
                    activity_type:
                      type: string
                    intensity:
                      type: string
                    occurred_at:
                      type: string
                    local_date:
                      type: string
                    notes:
                      type: string
                    data_quality:
                      type: string
                    report_id:
                      type: string
                    generated_at:
                      type: string
                    version:
                      type: integer
                    day_summary:
                      type: string
                    symptom_summary:
                      type: string
                    food_and_timing_summary:
                      type: string
                    sleep_summary:
                      type: string
                    exercise_summary:
                      type: string
                    bowel_summary:
                      type: string
                    strongest_associations:
                      type: string
                    missing_data:
                      type: string
                    next_experiment:
                      type: string
                    experiment_rationale:
                      type: string
                    safety_note:
                      type: string
                    analysis_id:
                      type: string
                    target_date:
                      type: string
                      description: Target local date in YYYY-MM-DD format.
                    hypothesis:
                      type: string
                    factor_type:
                      type: string
                    candidate_exposure:
                      type: string
                    supporting_evidence:
                      type: string
                    evidence_against:
                      type: string
                    confounders:
                      type: string
                    observations_count:
                      type: integer
                    confidence:
                      type: string
                    confidence_rationale:
                      type: string
                    next_test:
                      type: string
                    status:
                      type: string
                    supersedes_analysis_id:
                      type: string
                    source_message_id:
                      type: string
                  additionalProperties: true
      responses:
        '200':
          description: API result. Check success and verify writes by reading the event back.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  code:
                    type: string
                  record_id:
                    type: string
                  duplicate:
                    type: boolean
                  event_type:
                    type: string
                  local_date:
                    type: string
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  counts:
                    type: object
                    additionalProperties: true
                  reports:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  hypotheses:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
